name: Pages

# GitHub Pages is the test URL. The Docker image stays host-agnostic.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}
          JAVA_API_BASE_URL: ${{ vars.JAVA_API_BASE_URL || 'http://localhost:8080' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
